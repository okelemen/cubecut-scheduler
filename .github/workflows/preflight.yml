name: CubeCut next-day publication preflight

on:
  schedule:
    - cron: '11 20 * * *' # 23:11 TR, check tomorrow
    - cron: '11 5 * * *'  # 08:11 TR, check today
  workflow_dispatch:
    inputs:
      date:
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment: cubecut
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CUBECUT_OAUTH_CLIENT_JSON: ${{ secrets.CUBECUT_OAUTH_CLIENT_JSON }}
      CUBECUT_YOUTUBE_TOKEN_JSON: ${{ secrets.CUBECUT_YOUTUBE_TOKEN_JSON }}
      CUBECUT_MEDIA_KEY: ${{ secrets.CUBECUT_MEDIA_KEY }}
      CHECK_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - name: Check OAuth, both slots, metadata, translations and encrypted media
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CHECK_DATE" ]]; then
            TARGET_DATE="$CHECK_DATE"
          elif [[ "${{ github.event.schedule }}" == '11 20 * * *' ]]; then
            TARGET_DATE="$(TZ=Europe/Istanbul date -d tomorrow +%F)"
          else
            TARGET_DATE="$(TZ=Europe/Istanbul date +%F)"
          fi
          python3 preflight.py --date "$TARGET_DATE"
          pip install -q cryptography==50.0.1
          python3 prepare_media.py "$TARGET_DATE" 14:00
          python3 prepare_media.py "$TARGET_DATE" 21:00
          echo "Both decrypted media hashes verified for $TARGET_DATE"
      - name: Open failure alarm
        if: failure()
        shell: bash
        run: |
          if [[ -n "$CHECK_DATE" ]]; then
            target="$CHECK_DATE"
          elif [[ "${{ github.event.schedule }}" == '11 20 * * *' ]]; then
            target="$(TZ=Europe/Istanbul date -d tomorrow +%F)"
          else
            target="$(TZ=Europe/Istanbul date +%F)"
          fi
          title="CubeCut PREFLIGHT FAILED $target"
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The next publication day is not ready. Inspect run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Do not claim either slot is ready."
          fi
