name: CubeCut exact Turkey-time publication

on:
  schedule:
    - cron: '17 6 * * *'
    - cron: '29 7 * * *'
    - cron: '41 8 * * *'
    - cron: '17 13 * * *'
    - cron: '29 14 * * *'
    - cron: '41 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        required: true
        type: choice
        options:
          - morning
          - evening
          - relay-evening
      date:
        required: false
        type: string
      dry_run:
        required: true
        default: true
        type: boolean
      recovery:
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  relay-evening:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.slot == 'relay-evening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - name: Launch evening publication in its safe time window
        shell: bash
        run: |
          set -euo pipefail
          date="${TARGET_DATE:-$(TZ=Europe/Istanbul date +%F)}"
          python3 wait_until.py "$date" 15:15
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f slot=evening -f date="$date" -f dry_run=false -f recovery=false

  morning:
    concurrency:
      group: cubecut-morning-${{ inputs.dry_run && 'dry' || 'live' }}
      cancel-in-progress: false
    if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '17 6 * * *' || github.event.schedule == '29 7 * * *' || github.event.schedule == '41 8 * * *')) || (github.event_name == 'workflow_dispatch' && inputs.slot == 'morning') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment: cubecut
    env:
      OVERRIDE_DATE: ${{ inputs.date }}
      DRY_RUN: ${{ inputs.dry_run }}
      RECOVERY: ${{ inputs.recovery }}
      GH_TOKEN: ${{ github.token }}
      CUBECUT_OAUTH_CLIENT_JSON: ${{ secrets.CUBECUT_OAUTH_CLIENT_JSON }}
      CUBECUT_YOUTUBE_TOKEN_JSON: ${{ secrets.CUBECUT_YOUTUBE_TOKEN_JSON }}
      CUBECUT_MEDIA_KEY: ${{ secrets.CUBECUT_MEDIA_KEY }}
      CUBECUT_LIVE_ENABLED: ${{ vars.CUBECUT_LIVE_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage at 12:00 and publish at 14:00 Turkey time
        shell: bash
        run: |
          set -euo pipefail
          test "$CUBECUT_LIVE_ENABLED" = true
          TARGET_DATE="${OVERRIDE_DATE:-$(TZ=Europe/Istanbul date +%F)}"
          if [[ "$DRY_RUN" != "true" && "$RECOVERY" != "true" ]] &&
             (( 10#$(TZ=Europe/Istanbul date +%H) < 8 )); then
            echo 'Morning job started before its viable Turkey-time window; skipping stale cron event.'
            exit 0
          fi
          if [[ "$DRY_RUN" != "true" ]]; then
            git fetch -q origin main
            git show origin/main:state.json > state.json
          fi
          if [[ "$DRY_RUN" != "true" ]] && python3 already_done.py "$TARGET_DATE" 14:00; then
            echo 'Morning slot already published and commented.'
            exit 0
          fi
          pip install -q cryptography==50.0.1
          python3 prepare_media.py "$TARGET_DATE" 14:00
          python3 publisher.py --schedule '53 11 * * *' --dry-run --date "$TARGET_DATE"
          if [[ "$DRY_RUN" == "true" ]]; then exit 0; fi
          if [[ "$RECOVERY" == "true" ]]; then
            python3 publisher.py --schedule '53 11 * * *' --date "$TARGET_DATE" --recovery
            python3 save_state.py "$TARGET_DATE-14:00"
            python3 publisher.py --schedule '53 13 * * *' --date "$TARGET_DATE" --recovery
            python3 save_state.py "$TARGET_DATE-14:00"
            exit 0
          fi
          python3 wait_until.py "$TARGET_DATE" 11:53 --allow-past
          python3 publisher.py --schedule '53 11 * * *'
          python3 save_state.py "$TARGET_DATE-14:00"
          python3 wait_until.py "$TARGET_DATE" 13:53
          python3 publisher.py --schedule '53 13 * * *'
          python3 save_state.py "$TARGET_DATE-14:00"
      - name: Record failed live morning publication
        if: ${{ failure() && inputs.dry_run != true }}
        shell: bash
        run: |
          title="CubeCut LIVE FAILED ${OVERRIDE_DATE:-$(TZ=Europe/Istanbul date +%F)} 14:00 TR"
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Live publication failed. Check run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID and verify actual YouTube state before retrying."
          fi

  evening:
    concurrency:
      group: cubecut-evening-${{ inputs.dry_run && 'dry' || 'live' }}
      cancel-in-progress: false
    if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '17 13 * * *' || github.event.schedule == '29 14 * * *' || github.event.schedule == '41 15 * * *')) || (github.event_name == 'workflow_dispatch' && inputs.slot == 'evening') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment: cubecut
    env:
      OVERRIDE_DATE: ${{ inputs.date }}
      DRY_RUN: ${{ inputs.dry_run }}
      RECOVERY: ${{ inputs.recovery }}
      GH_TOKEN: ${{ github.token }}
      CUBECUT_OAUTH_CLIENT_JSON: ${{ secrets.CUBECUT_OAUTH_CLIENT_JSON }}
      CUBECUT_YOUTUBE_TOKEN_JSON: ${{ secrets.CUBECUT_YOUTUBE_TOKEN_JSON }}
      CUBECUT_MEDIA_KEY: ${{ secrets.CUBECUT_MEDIA_KEY }}
      CUBECUT_LIVE_ENABLED: ${{ vars.CUBECUT_LIVE_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage at 19:00 and publish at 21:00 Turkey time
        shell: bash
        run: |
          set -euo pipefail
          test "$CUBECUT_LIVE_ENABLED" = true
          TARGET_DATE="${OVERRIDE_DATE:-$(TZ=Europe/Istanbul date +%F)}"
          if [[ "$DRY_RUN" != "true" && "$RECOVERY" != "true" ]] &&
             (( 10#$(TZ=Europe/Istanbul date +%H) < 15 )); then
            echo 'Evening job started before its viable Turkey-time window; skipping stale cron event.'
            exit 0
          fi
          if [[ "$DRY_RUN" != "true" ]]; then
            git fetch -q origin main
            git show origin/main:state.json > state.json
          fi
          if [[ "$DRY_RUN" != "true" ]] && python3 already_done.py "$TARGET_DATE" 21:00; then
            echo 'Evening slot already published and commented.'
            exit 0
          fi
          pip install -q cryptography==50.0.1
          python3 prepare_media.py "$TARGET_DATE" 21:00
          python3 publisher.py --schedule '53 18 * * *' --dry-run --date "$TARGET_DATE"
          if [[ "$DRY_RUN" == "true" ]]; then exit 0; fi
          if [[ "$RECOVERY" == "true" ]]; then
            python3 publisher.py --schedule '53 18 * * *' --date "$TARGET_DATE" --recovery
            python3 save_state.py "$TARGET_DATE-21:00"
            python3 publisher.py --schedule '53 20 * * *' --date "$TARGET_DATE" --recovery
            python3 save_state.py "$TARGET_DATE-21:00"
            exit 0
          fi
          python3 wait_until.py "$TARGET_DATE" 18:53 --allow-past
          python3 publisher.py --schedule '53 18 * * *'
          python3 save_state.py "$TARGET_DATE-21:00"
          python3 wait_until.py "$TARGET_DATE" 20:53
          python3 publisher.py --schedule '53 20 * * *'
          python3 save_state.py "$TARGET_DATE-21:00"
      - name: Record failed live evening publication
        if: ${{ failure() && inputs.dry_run != true }}
        shell: bash
        run: |
          title="CubeCut LIVE FAILED ${OVERRIDE_DATE:-$(TZ=Europe/Istanbul date +%F)} 21:00 TR"
          if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Live publication failed. Check run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID and verify actual YouTube state before retrying."
          fi
